schema_version: 1

context:
  version: "16.2.0"

recipe:
  name: trilinos-split
  version: ${{ version }}

source:
  url: https://github.com/trilinos/Trilinos/archive/trilinos-release-${{ version | replace('.', '-') }}.tar.gz
  sha256: 543aa56232d7c0cbe73705fab2d3b5524f11b15fef8917aa14de02d23a5ca418
  patches:
    - swig-include-dirs.patch
    - tpetra-swig-remove-classic.patch
    - pytrilinos-python-version.patch

build:
  number: 3
  skip: win

outputs:
  - staging:
      name: trilinos-split-build
    build:
      script: build
    requirements:
      build:
        - cmake >=3.23.0
        - ninja
        - make
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
        - numpy
        - swig
      host:
        - libblas
        - liblapack
        - if: unix
          then: ${{ mpi }}
        - libboost-devel
        - suitesparse
        - libnetcdf
        - netcdf-cxx4
        - libmatio
        - xorg-libx11
        - hdf5
        - hdf5 <2 mpi_${{ mpi }}_*
        # trilinos cmake expects specific kokkos/kokkos-kernels versions
        - kokkos ==4.7.01
        - kokkos-kernels ==4.7.01
        - numpy
        - python
        - if: match(python, "==3.13")
          then: python_abi * *_cp313
        - swig
        - mpi4py

  - package:
      name: trilinos
    inherit: trilinos-split-build
    build:
      files:
        - include/*
        - if: linux
          then: lib/lib*.so*
        - if: osx
          then: lib/lib*.dylib
        - lib/cmake/Trilinos/*
        - share/trilinos/*
    requirements:
      run:
        - if: unix
          then: ${{ mpi }}
        - libboost-devel
        - suitesparse
        - kokkos ==4.7.01
        - kokkos-kernels ==4.7.01
        - hdf5 <2 mpi_${{ mpi }}_*
        - libnetcdf
        - netcdf-cxx4
        - libmatio
        - xorg-libx11
      run_exports:
        - ${{ pin_subpackage('trilinos', upper_bound='x.x') }}
    tests:
      - script:
          - if: unix
            then: test -f $PREFIX/include/TeuchosCore_ConfigDefs.hpp
          - if: osx
            then: test -f $PREFIX/lib/libteuchoscore.${{ version }}.dylib
          - if: linux
            then: test -f $PREFIX/lib/libteuchoscore.so.${{ version }}
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\TeuchosCore_ConfigDefs.hpp exit 1
              - if not exist %PREFIX%\\Library\\lib\\teuchoscore.lib exit 1
  - package:
      name: pytrilinos
    inherit: trilinos-split-build
    build:
      files:
        - lib/python*/site-packages/PyTrilinos/*
        - lib/python*/site-packages/PyTrilinos/**/*
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('trilinos', exact=True) }}
        - python
        - numpy
        - mpi4py
        - if: unix
          then: ${{ mpi }}
    tests:
      - python:
          imports:
            - PyTrilinos.Teuchos
            - PyTrilinos.Epetra
            - PyTrilinos.TriUtils
            - PyTrilinos.Tpetra
            - PyTrilinos.EpetraExt
            - PyTrilinos.Isorropia
            - PyTrilinos.Pliris
            - PyTrilinos.AztecOO
            - PyTrilinos.Galeri
            - PyTrilinos.Amesos
            - PyTrilinos.IFPACK
            - PyTrilinos.ML
            - PyTrilinos.Anasazi
            - PyTrilinos.NOX
            - PyTrilinos.NOX.Abstract
            - PyTrilinos.NOX.StatusTest
            - PyTrilinos.NOX.Solver
            - PyTrilinos.NOX.Epetra
            - PyTrilinos.NOX.Epetra.Interface
            - PyTrilinos.LOCA
          pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Sandia's suite of HPC solvers and enabling technologies
  description: Fast, compiled object-oriented algorithms and enabling technologies that support the solution of large-scale, complex multi-physics engineering and scientific problems.
  homepage: https://trilinos.org
  repository: https://github.com/trilinos/Trilinos

extra:
  recipe-maintainers:
    - rfiorella
    - pyt-viper
