schema_version: 1

context:
  version: "17.2.1"
  # binder generates the PyTrilinos2 bindings; it is built from source at build
  # time (not on conda-forge) against this LLVM, the newest it supports.
  binder_version: "1.4.3"
  binder_llvm: "19.1.7"

recipe:
  name: trilinos-split
  version: ${{ version }}

source:
  - url: https://github.com/trilinos/Trilinos/archive/trilinos-release-${{ version | replace('.', '-') }}.tar.gz
    sha256: b1d076c9c474893ddb340f0e2418a2dec50f52edaf134b54e4c01c5c53032eae
    patches:
      - pytrilinos2-install-init.patch
      - pytrilinos2-fix-build-errors.patch
  - url: https://github.com/RosettaCommons/binder/archive/refs/tags/v${{ binder_version }}.tar.gz
    sha256: d595f800501e2156d4e4b8f4bc0ce142da2f147f9a98d488dfe24ae79c8ef6cf
    target_directory: binder

build:
  number: 0
  skip:
    - win
    # PyTrilinos2 links libtorch; drop once pytorch is built for python 3.15
    - match(python, ">=3.15")

outputs:
  - staging:
      name: trilinos-split-build
    build:
      script: build
    requirements:
      build:
        - cmake >=3.23.0
        - gtest
        - ninja
        - make
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
      host:
        - libblas
        - liblapack
        - libxml2
        - if: unix
          then: ${{ mpi }}
        - libboost-devel
        - suitesparse
        - libnetcdf
        - netcdf-cxx4
        - libmatio
        - xorg-libx11
        - hdf5
        - hdf5 <2 mpi_${{ mpi }}_*
        # trilinos cmake expects specific kokkos/kokkos-kernels versions
        - kokkos ==5.2.1
        - kokkos-kernels ==5.2.1
        - python
        - if: match(python, "==3.13")
          then: python_abi * *_cp313
        - mpi4py
        - pybind11
        - libtorch
        - pytorch * cpu_*
        # for building binder (and its Clang resource and libc++ headers)
        - clangdev ==${{ binder_llvm }}
        - llvmdev ==${{ binder_llvm }}

  - package:
      name: trilinos
    inherit: trilinos-split-build
    build:
      files:
        - include/*
        - if: linux
          then: lib/lib*.so*
        - if: osx
          then: lib/lib*.dylib
        - lib/cmake/Trilinos/*
        - share/trilinos/*
    requirements:
      run:
        - if: unix
          then: ${{ mpi }}
        - libboost-devel
        - suitesparse
        - kokkos ==5.2.1
        - kokkos-kernels ==5.2.1
        - hdf5 <2 mpi_${{ mpi }}_*
        - libnetcdf
        - netcdf-cxx4
        - libmatio
        - xorg-libx11
      run_exports:
        - ${{ pin_subpackage('trilinos', upper_bound='x.x') }}
    tests:
      - script:
          - if: unix
            then: test -f $PREFIX/include/TeuchosCore_ConfigDefs.hpp
          - if: osx
            then: test -f $PREFIX/lib/libteuchoscore.${{ version }}.dylib
          - if: linux
            then: test -f $PREFIX/lib/libteuchoscore.so.${{ version }}
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\TeuchosCore_ConfigDefs.hpp exit 1
              - if not exist %PREFIX%\\Library\\lib\\teuchoscore.lib exit 1
  - package:
      name: pytrilinos
    inherit: trilinos-split-build
    build:
      files:
        - lib/python*/site-packages/PyTrilinos2/**
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('trilinos', exact=True) }}
        - python
        - numpy
        - mpi4py
        - pytorch
        - if: unix
          then: ${{ mpi }}
    tests:
      - python:
          imports:
            - PyTrilinos2
            - PyTrilinos2.getTpetraTypeName
          pip_check: false
      - script:
          - python -c "from PyTrilinos2 import Teuchos, Tpetra, Thyra, Stratimikos, MueLu"
          - python -c "from PyTrilinos2 import Teuchos; p = Teuchos.ParameterList(); p.set('sweeps', 5); assert p.get('sweeps') == 5"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Sandia's suite of HPC solvers and enabling technologies
  description: Fast, compiled object-oriented algorithms and enabling technologies that support the solution of large-scale, complex multi-physics engineering and scientific problems.
  homepage: https://trilinos.org
  repository: https://github.com/trilinos/Trilinos

extra:
  recipe-maintainers:
    - rfiorella
    - pyt-viper
